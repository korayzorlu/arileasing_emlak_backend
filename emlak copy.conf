server {
    listen 80;
    server_name emlak.arileasing.com.tr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name emlak.arileasing.com.tr;

    ssl_certificate     /etc/nginx/certs/arileasing_fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/arileasing.key;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    location /admin/ {
        #proxy_pass http://web:8000;  # Django uygulamasına yönlendir
        #proxy_pass http://188.132.143.226:8000;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        #proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
